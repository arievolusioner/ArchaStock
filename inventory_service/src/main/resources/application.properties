# HTTP & Server Config
quarkus.http.port=8083

# PostgreSQL Database Config
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=502091
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inventory_service

# Flyway Migration Setup
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Hibernate ORM Config
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.mapping.format.global=ignore

# SmallRye JWT Auth Validation
mp.jwt.verify.issuer=https://omnichannel.ari.com/issuer

# OpenAPI & Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true